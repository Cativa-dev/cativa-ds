  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n}\n<\u002Fstyle>\n<script src=\"9075e25e-cca9-444b-b20a-613f7e76c35e\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body { font-family: 'Onest', system-ui, sans-serif; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: var(--border-strong, rgba(255,255,255,.14)); border-radius: 8px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  a { color: var(--primary, #8b5cf6); text-decoration: none; }\n  a:hover { color: var(--primary-strong, #7c3aed); }\n  input, textarea, select, button { font-family: inherit; }\n  @keyframes cds-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  @keyframes cds-toast { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n  @keyframes cds-spin { to { transform: rotate(360deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ rootStyle }}\">\n\n  <!-- SIDEBAR -->\n  <aside style=\"width: 264px; flex-shrink: 0; height: 100vh; position: sticky; top: 0; background: var(--surface, #141416); border-right: 1px solid var(--border, rgba(255,255,255,.07)); display: flex; flex-direction: column; padding: 20px 14px;\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px;\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\">\n        <circle cx=\"9\" cy=\"9\" r=\"3.4\" fill=\"var(--primary, #8b5cf6)\"><\u002Fcircle>\n        <circle cx=\"23\" cy=\"9\" r=\"3.4\" fill=\"var(--text, #f4f4f6)\"><\u002Fcircle>\n        <circle cx=\"16\" cy=\"20\" r=\"3.4\" fill=\"var(--primary, #8b5cf6)\"><\u002Fcircle>\n        <circle cx=\"24\" cy=\"23\" r=\"2.4\" fill=\"var(--primary-strong, #7c3aed)\"><\u002Fcircle>\n      <\u002Fsvg>\n      <span style=\"font-size: 19px; font-weight: 700; letter-spacing: -.02em;\">cativa<\u002Fspan>\n      <span style=\"margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--text-3, #71717a); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 6px; padding: 2px 6px;\">DS<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--text-3, #71717a); padding: 8px 10px 6px;\">FUNDAÇÕES<\u002Fdiv>\n    <sc-for list=\"{{ navFoundations }}\" as=\"item\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\" style-hover=\"background: var(--surface-2, #1b1b1f)\">\n        <i data-lucide=\"{{ item.icon }}\" width=\"17\" height=\"17\"><\u002Fi>\n        <span>{{ item.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n\n    <div style=\"font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--text-3, #71717a); padding: 16px 10px 6px;\">COMPONENTES<\u002Fdiv>\n    <sc-for list=\"{{ navComponents }}\" as=\"item\" hint-placeholder-count=\"10\">\n      <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\" style-hover=\"background: var(--surface-2, #1b1b1f)\">\n        <i data-lucide=\"{{ item.icon }}\" width=\"17\" height=\"17\"><\u002Fi>\n        <span>{{ item.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n\n    <div style=\"margin-top: auto; padding-top: 16px;\">\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text-2, #a1a1aa); font-size: 13px; font-weight: 600; cursor: pointer;\" style-hover=\"border-color: var(--border-strong, rgba(255,255,255,.14))\">\n        <i data-lucide=\"{{ themeIcon }}\" width=\"16\" height=\"16\"><\u002Fi>\n        <span>Tema: {{ themeLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- MAIN -->\n  <main style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n    <header style=\"position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg, #0a0a0c) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border, rgba(255,255,255,.07)); padding: 18px 40px; display: flex; align-items: center; gap: 16px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3, #71717a);\">\n        <span>Design System<\u002Fspan>\n        <i data-lucide=\"chevron-right\" width=\"14\" height=\"14\"><\u002Fi>\n        <span style=\"color: var(--text, #f4f4f6); font-weight: 600;\">{{ sectionTitle }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-left: auto; display: flex; align-items: center; gap: 10px;\">\n        <span style=\"font-size: 12px; color: var(--text-3, #71717a);\">Primária<\u002Fspan>\n        <span style=\"width: 22px; height: 22px; border-radius: 6px; background: var(--primary, #8b5cf6); border: 1px solid var(--border-strong, rgba(255,255,255,.14));\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"padding: 40px; max-width: 1120px; width: 100%;\">\n\n      <!-- ============ OVERVIEW ============ -->\n      <sc-if value=\"{{ secOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <div style=\"font-family: 'Newsreader', serif; font-size: 15px; font-style: italic; color: var(--primary, #8b5cf6); margin-bottom: 8px;\">Sistema de design<\u002Fdiv>\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 56px; line-height: 1.02; font-weight: 600; letter-spacing: -.02em; margin: 0 0 18px;\">Cativa Design System<\u002Fh1>\n        <p style=\"font-size: 17px; line-height: 1.6; color: var(--text-2, #a1a1aa); max-width: 620px; margin: 0 0 36px;\">Tokens, tipografia, iconografia e componentes para que qualquer aplicação embedada dentro da plataforma Cativa pareça nativa. Escuro por padrão, com tema claro e primária ajustável.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 22px; position: relative; overflow: hidden;\">\n            <div style=\"position: absolute; inset: 0; background: radial-gradient(140% 90% at 0% 0%, var(--primary-soft, rgba(139,92,246,.14)), transparent 55%);\"><\u002Fdiv>\n            <div style=\"position: relative;\">\n              <div style=\"width: 40px; height: 40px; border-radius: 11px; background: var(--primary-soft, rgba(139,92,246,.14)); display: grid; place-items: center; color: var(--primary, #8b5cf6); margin-bottom: 14px;\"><i data-lucide=\"palette\" width=\"20\" height=\"20\"><\u002Fi><\u002Fdiv>\n              <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 4px;\">Fundações<\u002Fdiv>\n              <div style=\"font-size: 13px; color: var(--text-2, #a1a1aa); line-height: 1.5;\">Cores, escala tipográfica, espaçamento, raios e elevação como tokens.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 22px; position: relative; overflow: hidden;\">\n            <div style=\"position: absolute; inset: 0; background: radial-gradient(140% 90% at 0% 0%, var(--success-soft, rgba(52,211,153,.13)), transparent 55%);\"><\u002Fdiv>\n            <div style=\"position: relative;\">\n              <div style=\"width: 40px; height: 40px; border-radius: 11px; background: var(--success-soft, rgba(52,211,153,.13)); display: grid; place-items: center; color: var(--success, #34d399); margin-bottom: 14px;\"><i data-lucide=\"component\" width=\"20\" height=\"20\"><\u002Fi><\u002Fdiv>\n              <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 4px;\">Componentes<\u002Fdiv>\n              <div style=\"font-size: 13px; color: var(--text-2, #a1a1aa); line-height: 1.5;\">Botões, forms, cards, tabelas, overlays e feedback prontos.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 22px; position: relative; overflow: hidden;\">\n            <div style=\"position: absolute; inset: 0; background: radial-gradient(140% 90% at 0% 0%, var(--warning-soft, rgba(251,191,36,.13)), transparent 55%);\"><\u002Fdiv>\n            <div style=\"position: relative;\">\n              <div style=\"width: 40px; height: 40px; border-radius: 11px; background: var(--warning-soft, rgba(251,191,36,.13)); display: grid; place-items: center; color: var(--warning, #fbbf24); margin-bottom: 14px;\"><i data-lucide=\"shapes\" width=\"20\" height=\"20\"><\u002Fi><\u002Fdiv>\n              <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 4px;\">Iconografia<\u002Fdiv>\n              <div style=\"font-size: 13px; color: var(--text-2, #a1a1aa); line-height: 1.5;\">Ícones de linha, traço 1.5px, arredondados — família Lucide.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 14px; padding: 18px;\">\n            <div style=\"font-size: 28px; font-weight: 800; letter-spacing: -.02em;\">2<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa); margin-top: 2px;\">temas — claro &amp; escuro<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 14px; padding: 18px;\">\n            <div style=\"font-size: 28px; font-weight: 800; letter-spacing: -.02em;\">3<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa); margin-top: 2px;\">famílias tipográficas<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 14px; padding: 18px;\">\n            <div style=\"font-size: 28px; font-weight: 800; letter-spacing: -.02em;\">5<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa); margin-top: 2px;\">cores semânticas<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 14px; padding: 18px;\">\n            <div style=\"font-size: 28px; font-weight: 800; letter-spacing: -.02em;\">40+<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa); margin-top: 2px;\">ícones curados<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ COLORS ============ -->\n      <sc-if value=\"{{ secColors }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Cores<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px; max-width: 560px;\">Toda cor é um token CSS. Superfícies neutras levemente frias, primária violeta e cinco cores semânticas com variante “soft” para fundos.<\u002Fp>\n        <sc-for list=\"{{ colorGroups }}\" as=\"grp\" hint-placeholder-count=\"4\">\n          <div style=\"margin-bottom: 30px;\">\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 12px;\">{{ grp.name }}<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px;\">\n              <sc-for list=\"{{ grp.swatches }}\" as=\"sw\" hint-placeholder-count=\"4\">\n                <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 12px; overflow: hidden;\">\n                  <div style=\"{{ sw.style }}; height: 68px;\"><\u002Fdiv>\n                  <div style=\"padding: 10px 12px;\">\n                    <div style=\"font-size: 13px; font-weight: 600;\">{{ sw.token }}<\u002Fdiv>\n                    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3, #71717a); margin-top: 2px;\">{{ sw.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ TYPOGRAPHY ============ -->\n      <sc-if value=\"{{ secType }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Tipografia<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px; max-width: 560px;\">Três famílias: <b>Onest<\u002Fb> para toda a interface, <b>Newsreader<\u002Fb> para títulos editoriais e heróis, <b>JetBrains Mono<\u002Fb> para IDs, tokens e código.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--text-3, #71717a); margin-bottom: 10px;\">UI · SANS<\u002Fdiv>\n            <div style=\"font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1;\">Onest<\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--text-2, #a1a1aa); margin-top: 14px;\">Aa Bb Cc · 0123456789<\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--text-3, #71717a); margin-top: 6px;\">400 · 500 · 600 · 700 · 800<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--text-3, #71717a); margin-bottom: 10px;\">EDITORIAL · SERIF<\u002Fdiv>\n            <div style=\"font-family: 'Newsreader', serif; font-size: 48px; font-weight: 600; line-height: 1;\">Newsreader<\u002Fdiv>\n            <div style=\"font-family: 'Newsreader', serif; font-size: 15px; font-style: italic; color: var(--text-2, #a1a1aa); margin-top: 14px;\">Garanta a primeira vitória do seu cliente<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 8px 24px;\">\n          <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; align-items: baseline; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--border, rgba(255,255,255,.07));\">\n              <div style=\"width: 130px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3, #71717a);\">{{ t.meta }}<\u002Fdiv>\n              <div style=\"{{ t.style }}; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ t.sample }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ SPACING ============ -->\n      <sc-if value=\"{{ secSpacing }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Espaçamento &amp; Raios<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px; max-width: 560px;\">Escala base 4px. Raios de canto do fino (chips) ao pill.<\u002Fp>\n\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 14px;\">Escala de espaçamento<\u002Fdiv>\n        <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 20px 24px; margin-bottom: 32px;\">\n          <sc-for list=\"{{ spacing }}\" as=\"sp\" hint-placeholder-count=\"8\">\n            <div style=\"display: flex; align-items: center; gap: 20px; padding: 8px 0;\">\n              <div style=\"width: 60px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-2, #a1a1aa);\">{{ sp.name }}<\u002Fdiv>\n              <div style=\"width: 52px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-3, #71717a);\">{{ sp.px }}<\u002Fdiv>\n              <div style=\"{{ sp.style }}; height: 14px; border-radius: 4px; background: var(--primary, #8b5cf6);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 14px;\">Raios de canto<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;\">\n          <sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"text-align: center;\">\n              <div style=\"{{ r.style }}; height: 84px; background: var(--primary-soft, rgba(139,92,246,.14)); border: 1px solid var(--primary, #8b5cf6);\"><\u002Fdiv>\n              <div style=\"font-size: 12px; font-weight: 600; margin-top: 10px;\">{{ r.name }}<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3, #71717a);\">{{ r.px }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ ELEVATION ============ -->\n      <sc-if value=\"{{ secElevation }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Elevação<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px; max-width: 560px;\">Sombras discretas para superfícies flutuantes; glow colorido reservado para ações primárias e cards de destaque.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;\">\n          <div style=\"padding: 28px; border-radius: 16px; background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07));\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 4px;\">flat · base<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">Superfície de conteúdo, sem sombra<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 28px; border-radius: 16px; background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); box-shadow: 0 4px 16px rgba(0,0,0,.28);\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 4px;\">raised · dropdown<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">0 4px 16px rgba(0,0,0,.28)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 28px; border-radius: 16px; background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); box-shadow: 0 18px 50px rgba(0,0,0,.45);\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 4px;\">overlay · modal<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">0 18px 50px rgba(0,0,0,.45)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 28px; border-radius: 16px; background: var(--surface, #141416); border: 1px solid var(--primary, #8b5cf6); box-shadow: 0 10px 40px -8px var(--primary, #8b5cf6);\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 4px;\">glow · primária<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">0 10px 40px -8px primary<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ ICONS ============ -->\n      <sc-if value=\"{{ secIcons }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Iconografia<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px; max-width: 560px;\">Estilo de linha, traço 1.5px, cantos arredondados — família Lucide. Tamanhos 16 / 18 / 20 / 24px, cor herdada do texto.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px;\">\n          <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"40\">\n            <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 12px; padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px;\" style-hover=\"border-color: var(--primary, #8b5cf6); color: var(--primary, #8b5cf6)\">\n              <i data-lucide=\"{{ ic }}\" width=\"22\" height=\"22\"><\u002Fi>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3, #71717a);\">{{ ic }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ BUTTONS ============ -->\n      <sc-if value=\"{{ secButtons }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Botões<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px;\">Primária sólida com glow, secundária de superfície, ghost, e variantes semânticas.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 16px;\">Variantes<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px -6px var(--primary, #8b5cf6);\" style-hover=\"background: var(--primary-strong, #7c3aed)\"><i data-lucide=\"plus\" width=\"16\" height=\"16\"><\u002Fi>Primária<\u002Fbutton>\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: var(--surface-2, #1b1b1f); color: var(--text, #f4f4f6); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"background: var(--surface-3, #232328)\"><i data-lucide=\"download\" width=\"16\" height=\"16\"><\u002Fi>Secundária<\u002Fbutton>\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: transparent; color: var(--text-2, #a1a1aa); border: none; font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"background: var(--surface-2, #1b1b1f); color: var(--text, #f4f4f6)\">Ghost<\u002Fbutton>\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: var(--danger-soft, rgba(251,113,133,.13)); color: var(--danger, #fb7185); border: 1px solid transparent; font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"border-color: var(--danger, #fb7185)\"><i data-lucide=\"trash-2\" width=\"16\" height=\"16\"><\u002Fi>Perigo<\u002Fbutton>\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: var(--success-soft, rgba(52,211,153,.13)); color: var(--success, #34d399); border: 1px solid transparent; font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"border-color: var(--success, #34d399)\"><i data-lucide=\"check\" width=\"16\" height=\"16\"><\u002Fi>Sucesso<\u002Fbutton>\n              <button style=\"width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2, #1b1b1f); color: var(--text-2, #a1a1aa); border: 1px solid var(--border, rgba(255,255,255,.07)); cursor: pointer;\" style-hover=\"color: var(--text, #f4f4f6)\"><i data-lucide=\"settings\" width=\"17\" height=\"17\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n            <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n              <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 16px;\">Tamanhos<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n                <button style=\"padding: 6px 12px; border-radius: 8px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;\">Small<\u002Fbutton>\n                <button style=\"padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;\">Medium<\u002Fbutton>\n                <button style=\"padding: 13px 24px; border-radius: 12px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;\">Large<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n              <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 16px;\">Estados<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n                <button style=\"padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;\">Normal<\u002Fbutton>\n                <button style=\"padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary-strong, #7c3aed); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;\">Hover<\u002Fbutton>\n                <button style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary, #8b5cf6); color: #fff; opacity: .55; font-size: 14px; font-weight: 600;\"><span style=\"width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: cds-spin .7s linear infinite; display: inline-block;\"><\u002Fspan>Carregando<\u002Fbutton>\n                <button disabled=\"\" style=\"padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border, rgba(255,255,255,.07)); background: var(--surface-2, #1b1b1f); color: var(--text-3, #71717a); font-size: 14px; font-weight: 600; cursor: not-allowed;\">Desabilitado<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 16px;\">Segmentado &amp; toggle<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: center;\">\n              <div style=\"display: inline-flex; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 10px; padding: 4px; gap: 4px;\">\n                <button sc-camel-on-click=\"{{ setSegInativa }}\" style=\"{{ segInativaStyle }}\">● Inativa<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setSegAtiva }}\" style=\"{{ segAtivaStyle }}\">● Ativa<\u002Fbutton>\n                <button style=\"padding: 7px 16px; border-radius: 7px; border: none; background: transparent; color: var(--text-2, #a1a1aa); font-size: 13px; font-weight: 600; cursor: pointer;\">Salvar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ FORMS ============ -->\n      <sc-if value=\"{{ secForms }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Inputs &amp; Formulários<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px;\">Campos de superfície escura, foco em anel violeta, prefixo de ícone e atalho de teclado.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px;\">\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 8px;\">Nome da automação<\u002Flabel>\n              <input type=\"text\" placeholder=\"Ex.: Boas-vindas para novo membro\" style=\"width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text, #f4f4f6); font-size: 14px; outline: none;\" style-focus=\"border-color: var(--primary, #8b5cf6); box-shadow: 0 0 0 3px var(--primary-soft, rgba(139,92,246,.14))\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 8px;\">Buscar<\u002Flabel>\n              <div style=\"position: relative;\">\n                <i data-lucide=\"search\" width=\"16\" height=\"16\" style=\"position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3, #71717a);\"><\u002Fi>\n                <input type=\"text\" placeholder=\"Buscar por nome, email ou username…\" style=\"width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text, #f4f4f6); font-size: 14px; outline: none;\" style-focus=\"border-color: var(--primary, #8b5cf6); box-shadow: 0 0 0 3px var(--primary-soft, rgba(139,92,246,.14))\">\n                <span style=\"position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3, #71717a); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 5px; padding: 2px 6px;\">⌘K<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 8px;\">Evento<\u002Flabel>\n              <div style=\"position: relative;\">\n                <sc-raw-select style=\"width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text-2, #a1a1aa); font-size: 14px; outline: none; appearance: none; cursor: pointer;\">\n                  <option>Selecione um evento…<\u002Foption>\n                  <option>Novo membro<\u002Foption>\n                  <option>Curso concluído<\u002Foption>\n                <\u002Fsc-raw-select>\n                <i data-lucide=\"chevron-down\" width=\"16\" height=\"16\" style=\"position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3, #71717a); pointer-events: none;\"><\u002Fi>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: v der: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text-3, #71717a); font-size: 13px; font-weight: 600; cursor: pointer;\"><i data-lucide=\"chevron-left\" width=\"15\" height=\"15\"><\u002Fi>Anterior<\u002Fbutton>\n              <span style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">Página 1 de 410<\u002Fspan>\n              <button style=\"display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); color: var(--text, #f4f4f6); font-size: 13px; font-weight: 600; cursor: pointer;\">Próxima<i data-lucide=\"chevron-right\" width=\"15\" height=\"15\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 14px;\">Sidebar<\u002Fdiv>\n            <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 12px;\">\n              <sc-for list=\"{{ miniNav }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div style=\"{{ m.style }}\">\n                  <i data-lucide=\"{{ m.icon }}\" width=\"17\" height=\"17\"><\u002Fi>\n                  <span>{{ m.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ TABLES ============ -->\n      <sc-if value=\"{{ secTables }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Tabelas &amp; Listagens<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a  }}<\u002Fspan>\n              <span>\n                <sc-if value=\"{{ u.seal }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width: 22px; height: 22px; display: grid; place-items: center; background: var(--primary, #8b5cf6); color: #fff; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);\"><i data-lucide=\"star\" width=\"11\" height=\"11\"><\u002Fi><\u002Fspan><\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">{{ u.date }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ OVERLAYS ============ -->\n      <sc-if value=\"{{ secOverlays }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Modais &amp; Overlays<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px;\">Modal centralizado, popover de assistente e tooltip.<\u002Fp>\n        <div style=\"display: flex; gap: 12px; margin-bottom: 32px;\">\n          <button sc-camel-on-click=\"{{ openModal }}\" style=\"padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary, #8b5cf6); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px -6px var(--primary, #8b5cf6);\">Abrir modal<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showToastFn }}\" style=\"padding: 10px 18px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); color: var(--text, #f4f4f6); font-size: 14px; font-weight: 600; cursor: pointer;\">Disparar toast<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n          <div>\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 14px;\">Popover · assistente<\u002Fdiv>\n            <div style=\"width: 260px; border-radius: 16px; background: var(--surface, #141416); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); padding: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.45);\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;\"><span style=\"font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--primary, #8b5cf6);\">AURA IA<\u002Fspan><i data-lucide=\"x\" width=\"15\" height=\"15\" style=\"color: var(--text-3, #71717a);\"><\u002Fi><\u002Fdiv>\n              <div style=\"font-size: 14px; margin-bottom: 14px;\">Ricardo! Pronto pra mais uma sessão produtiva?<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                <button style=\"display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); color: var(--text, #f4f4f6); font-size: 12px; font-weight: 600; cursor: pointer;\"><i data-lucide=\"settings-2\" width=\"13\" height=\"13\"><\u002Fi>Customizar<\u002Fbutton>\n                <button style=\"display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; background: var(--primary, #8b5cf6); border: none; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;\"><i data-lucide=\"plus\" width=\"13\" height=\"13\"><\u002Fi>Criar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin-bottom: 14px;\">Tooltip<\u002Fdiv>\n            <div style=\"display: inline-flex; flex-direction: column; align-items: center; gap: 10px;\">\n              <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--surface-3, #232328); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.28);\">Exportar planilha em CSV<\u002Fspan>\n              <span style=\"width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border, rgba(255,255,255,.07)); display: grid; place-items: center; color: var(--text-2, #a1a1aa);\"><i data-lucide=\"file-text\" width=\"18\" height=\"18\"><\u002Fi><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ FEEDBACK ============ -->\n      <sc-if value=\"{{ secFeedback }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Feedback<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px;\">Barra de aviso do topo, banners inline e toasts — um por cor semântica.<\u002Fp>\n\n        <div style=\"border-radius: 12px; overflow: hidden; border: 1px solid var(--warning, #fbbf24); margin-bottom: 24px;\">\n          <div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--warning-soft, rgba(251,191,36,.13));\">\n            <span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: var(--warning, #fbbf24); color: #1a1a1a; font-size: 11px; font-weight: 700; letter-spacing: .08em;\"><i data-lucide=\"megaphone\" width=\"13\" height=\"13\"><\u002Fi>AVISO<\u002Fspan>\n            <span style=\"font-size: 14px; font-weight: 500;\">Inscrições abertas para beta testers da Cativa v2<\u002Fspan>\n            <a href=\"#\" style=\"margin-left: auto; font-size: 13px; font-weight: 600; color: var(--warning, #fbbf24);\">Ativar →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--info-soft, rgba(34,211,238,.13)); border: 1px solid transparent;\">\n            <i data-lucide=\"info\" width=\"18\" height=\"18\" style=\"color: var(--info, #22d3ee); flex-shrink: 0; margin-top: 1px;\"><\u002Fi>\n            <div><div style=\"font-weight: 600; font-size: 14px;\">Informação<\u002Fdiv><div style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">Suas alterações são salvas automaticamente a cada 30 segundos.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--success-soft, rgba(52,211,153,.13)); border: 1px solid transparent;\">\n            <i data-lucide=\"check-circle-2\" width=\"18\" height=\"18\" style=\"color: var(--success, #34d399); flex-shrink: 0; margin-top: 1px;\"><\u002Fi>\n            <div><div style=\"font-weight: 600; font-size: 14px;\">Sucesso<\u002Fdiv><div style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">Automação criada e ativada com êxito.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--danger-soft, rgba(251,113,133,.13)); border: 1px solid transparent;\">\n            <i data-lucide=\"alert-triangle\" width=\"18\" height=\"18\" style=\"color: var(--danger, #fb7185); flex-shrink: 0; margin-top: 1px;\"><\u002Fi>\n            <div><div style=\"font-weight: 600; font-size: 14px;\">Erro<\u002Fdiv><div style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">Não foi possível conectar à integração. Tente novamente.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3, #71717a); margin: 28px 0 14px;\">Toast<\u002Fdiv>\n        <div style=\"display: inline-flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; background: var(--surface-3, #232328); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); box-shadow: 0 18px 50px rgba(0,0,0,.45);\">\n          <span style=\"width: 28px; height: 28px; border-radius: 8px; background: var(--success-soft, rgba(52,211,153,.13)); display: grid; place-items: center; color: var(--success, #34d399);\"><i data-lucide=\"check\" width=\"16\" height=\"16\"><\u002Fi><\u002Fspan>\n          <div><div style=\"font-size: 14px; font-weight: 600;\">Planilha exportada<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">6.042 usuários · usuarios.csv<\u002Fdiv><\u002Fdiv>\n          <i data-lucide=\"x\" width=\"16\" height=\"16\" style=\"color: var(--text-3, #71717a); margin-left: 8px;\"><\u002Fi>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ DATAVIZ ============ -->\n      <sc-if value=\"{{ secDataviz }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: cds-fade .3s ease;\">\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px;\">Visualização de dados<\u002Fh1>\n        <p style=\"font-size: 15px; color: var(--text-2, #a1a1aa); margin: 0 0 32px;\">Área suave, barras, progresso e anel — sempre na primária ou semântica.<\u002Fp>\n\n        <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px; margin-bottom: 20px;\">\n          <div style=\"font-weight: 700; font-size: 16px; margin-bottom: 4px;\">Atividade ao longo do tempo<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--text-3, #71717a); margin-bottom: 18px;\">Últimos 7 dias<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 700 200\" width=\"100%\" height=\"200\" sc-camel-preserve-aspect-ratio=\"none\">\n            <defs>\n              <linearGradient id=\"cdsArea\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"var(--primary, #8b5cf6)\" stop-opacity=\"0.35\"><\u002Fstop><stop offset=\"100%\" stop-color=\"var(--primary, #8b5cf6)\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient>\n            <\u002Fdefs>\n            <path d=\"M0,40 C80,40 90,150 175,150 C260,150 250,120 350,120 C440,120 430,175 525,175 C610,175 620,70 700,70 L700,200 L0,200 Z\" fill=\"url(#cdsArea)\"><\u002Fpath>\n            <path d=\"M0,40 C80,40 90,150 175,150 C260,150 250,120 350,120 C440,120 430,175 525,175 C610,175 620,70 700,70\" fill=\"none\" stroke=\"var(--primary, #8b5cf6)\" stroke-width=\"2.5\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px;\">\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px;\">\n            <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 20px;\">Barras<\u002Fdiv>\n            <div style=\"display: flex; align-items: flex-end; gap: 14px; height: 140px;\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end;\">\n                  <div style=\"{{ b.style }}; width: 100%; border-radius: 6px 6px 0 0; background: var(--primary, #8b5cf6);\"><\u002Fdiv>\n                  <span style=\"font-size: 11px; color: var(--text-3, #71717a);\">{{ b.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface, #141416); border: 1px solid var(--border, rgba(255,255,255,.07)); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;\">\n            <div style=\"width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--primary, #8b5cf6) 0% 68%, var(--surface-3, #232328) 68% 100%); display: grid; place-items: center;\">\n              <div style=\"width: 86px; height: 86px; border-radius: 50%; background: var(--surface, #141416); display: grid; place-items: center; font-size: 24px; font-weight: 800;\">68%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--text-2, #a1a1aa);\">Taxa de conclusão<\u002Fdiv>\n            <div style=\"width: 100%;\">\n              <div style=\"height: 8px; border-radius: 999px; background: var(--surface-3, #232328); overflow: hidden;\"><div style=\"width: 68%; height: 100%; background: var(--primary, #8b5cf6);\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <!-- MODAL -->\n  <sc-if value=\"{{ modal }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 24px; animation: cds-fade .2s ease;\" sc-camel-on-click=\"{{ closeModal }}\">\n    <div style=\"width: 440px; max-width: 100%; background: var(--surface, #141416); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); border-radius: 18px; padding: 26px; box-shadow: 0 24px 70px rgba(0,0,0,.55);\" sc-camel-on-click=\"{{ stop }}\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px;\">\n        <span style=\"width: 42px; height: 42px; border-radius: 12px; background: var(--danger-soft, rgba(251,113,133,.13)); display: grid; place-items: center; color: var(--danger, #fb7185);\"><i data-lucide=\"trash-2\" width=\"20\" height=\"20\"><\u002Fi><\u002Fspan>\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background: transparent; border: none; color: var(--text-3, #71717a); cursor: pointer;\"><i data-lucide=\"x\" width=\"20\" height=\"20\"><\u002Fi><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Newsreader', serif; font-size: 24px; font-weight: 600; margin: 10px 0 8px;\">Excluir automação?<\u002Fdiv>\n      <div style=\"font-size: 14px; color: var(--text-2, #a1a1aa); line-height: 1.55; margin-bottom: 24px;\">Esta ação não pode ser desfeita. A automação e todo o histórico de disparos serão removidos permanentemente.<\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; justify-content: flex-end;\">\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding: 10px 18px; border-radius: 10px; background: var(--surface-2, #1b1b1f); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); color: var(--text, #f4f4f6); font-size: 14px; font-weight: 600; cursor: pointer;\">Cancelar<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding: 10px 18px; border-radius: 10px; background: var(--danger, #fb7185); border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;\">Excluir<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- TOAST -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; bottom: 28px; right: 28px; z-index: 100; display: inline-flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; background: var(--surface-3, #232328); border: 1px solid var(--border-strong, rgba(255,255,255,.14)); box-shadow: 0 18px 50px rgba(0,0,0,.45); animation: cds-toast .25s ease;\">\n    <span style=\"width: 28px; height: 28px; border-radius: 8px; background: var(--success-soft, rgba(52,211,153,.13)); display: grid; place-items: center; color: var(--success, #34d399);\"><i data-lucide=\"check\" width=\"16\" height=\"16\"><\u002Fi><\u002Fspan>\n    <div><div style=\"font-size: 14px; font-weight: 600;\">Tudo certo!<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-2, #a1a1aa);\">Ação concluída com sucesso.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 820}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Aparência&quot;}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#8b5cf6&quot;, &quot;options&quot;: [&quot;#8b5cf6&quot;, &quot;#7c3aed&quot;, &quot;#22d3ee&quot;, &quot;#34d399&quot;, &quot;#f43f5e&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Aparência&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    section: 'overview',\n    theme: this.props.theme || 'dark',\n    modal: false,\n    toast: false,\n    seg: 'inativa',\n    tab: 'visao'\n  };\n\n  componentDidMount() { this._icons(); }\n  componentDidUpdate() { this._icons(); }\n  _icons() {\n    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }\n  }\n\n  themeVars() {\n    const accent = this.props.accent;\n    const dark = {\n      '--bg': '#0a0a0c', '--surface': '#141416', '--surface-2': '#1b1b1f', '--surface-3': '#232328',\n      '--border': 'rgba(255,255,255,0.07)', '--border-strong': 'rgba(255,255,255,0.14)',\n      '--text': '#f4f4f6', '--text-2': '#a1a1aa', '--text-3': '#71717a',\n      '--primary': '#8b5cf6', '--primary-strong': '#7c3aed', '--primary-soft': 'rgba(139,92,246,0.14)',\n      '--success': '#34d399', '--success-soft': 'rgba(52,211,153,0.13)',\n      '--danger': '#fb7185', '--danger-soft': 'rgba(251,113,133,0.13)',\n      '--warning': '#fbbf24', '--warning-soft': 'rgba(251,191,36,0.13)',\n      '--info': '#22d3ee', '--info-soft': 'rgba(34,211,238,0.13)'\n    };\n    const light = {\n      '--bg': '#f7f7f8', '--surface': '#ffffff', '--surface-2': '#f2f2f4', '--surface-3': '#e9e9ec',\n      '--border': 'rgba(9,9,11,0.08)', '--border-strong': 'rgba(9,9,11,0.14)',\n      '--text': '#18181b', '--text-2': '#52525b', '--text-3': '#a1a1aa',\n      '--primary': '#7c3aed', '--primary-strong': '#6d28d9', '--primary-soft': 'rgba(124,58,237,0.10)',\n      '--success': '#059669', '--success-soft': 'rgba(5,150,105,0.10)',\n      '--danger': '#e11d48', '--danger-soft': 'rgba(225,29,72,0.10)',\n      '--warning': '#d97706', '--warning-soft': 'rgba(217,119,8,0.10)',\n      '--info': '#0891b2', '--info-soft': 'rgba(8,145,178,0.10)'\n    };\n    const t = this.state.theme === 'light' ? light : dark;\n    if (accent) { t['--primary'] = accent; }\n    return t;\n  }\n\n  rootStyle() {\n    return Object.assign({}, this.themeVars(), {\n      minHeight: '100vh',\n      background: 'var(--bg)',\n      color: 'var(--text)',\n      display: 'flex',\n      fontFamily: \"'Onest', system-ui, sans-serif\"\n    });\n  }\n\n  navItem(id, label, icon) {\n    const active = this.state.section === id;\n    const base = {\n      display: 'flex', alignItems: 'center', gap: '12px', width: '100%', textAlign: 'left',\n      padding: '9px 12px', borderRadius: '10px', fontSize: '14px', fontWeight: 600,\n      cursor: 'pointer', border: '1px solid transparent', marginBottom: '2px',\n      transition: 'background .15s, color .15s',\n      background: active ? 'var(--surface-2, #1b1b1f)' : 'transparent',\n      color: active ? 'var(--text, #f4f4f6)' : 'var(--text-2, #a1a1aa)',\n      boxShadow: active ? 'inset 3px 0 0 var(--primary, #8b5cf6)' : 'none'\n    };\n    return { id, label, icon, style: base, onClick: () => this.setState({ section: id }) };\n  }\n\n  segStyle(val) {\n    const active = this.state.seg === val;\n    return {\n      padding: '7px 16px', borderRadius: '7px', border: 'none', fontSize: '13px', fontWeight: 600, cursor: 'pointer',\n      background: active ? 'var(--surface-3, #232328)' : 'transparent',\n      color: active ? 'var(--text, #f4f4f6)' : 'var(--text-2, #a1a1aa)'\n    };\n  }\n\n  tabStyle(val) {\n    const active = this.state.tab === val;\n    return {\n      padding: '4px 0 12px', border: 'none', background: 'transparent', cursor: 'pointer',\n      fontSize: '14px', fontWeight: 600, marginBottom: '-1px',\n      color: active ? 'var(--text, #f4f4f6)' : 'var(--text-2, #a1a1aa)',\n      borderBottom: active ? '2px solid var(--primary, #8b5cf6)' : '2px solid transparent'\n    };\n  }\n\n  miniNavItem(label, icon, active) {\n    return {\n      label, icon,\n      style: {\n        display: 'flex', alignItems: 'center', gap: '11px', padding: '9px 12px', borderRadius: '9px',\n        fontSize: '13px', fontWeight: 600, marginBottom: '2px',\n        background: active ? 'var(--surface-2, #1b1b1f)' : 'transparent',\n        color: active ? 'var(--text, #f4f4f6)' : 'var(--text-2, #a1a1aa)',\n        boxShadow: active ? 'inset 3px 0 0 var(--primary, #8b5cf6)' : 'none'\n      }\n    };\n  }\n\n  renderVals() {\n    const s = this.state.section;\n    const titles = {\n      overview: 'Visão geral', colors: 'Cores', type: 'Tipografia', spacing: 'Espaçamento & Raios',\n      elevation: 'Elevação', icons: 'Iconografia', buttons: 'Botões', forms: 'Inputs & Formulários',\n      badges: 'Badges & Status', cards: 'Cards & Painéis', metrics: 'Métricas', nav: 'Navegação',\n      tables: 'Tabelas', overlays: 'Overlays', feedback: 'Feedback', dataviz: 'Data viz'\n    };\n\n    const mk = (t) => ({ background: `var(--${t}, #8b5cf6)` });\n    const rawSwatch = (v) => ({ background: v });\n\n    const colorGroups = [\n      { name: 'Neutras · superfícies', swatches: [\n        { token: '--bg', value: 'page', style: mk('bg') },\n        { token: '--surface', value: 'card', style: mk('surface') },\n        { token: '--surface-2', value: 'input/hover', style: mk('surface-2') },\n        { token: '--surface-3', value: 'elevada', style: mk('surface-3') },\n        { token: '--border', value: 'divisor', style: mk('border') }\n      ]},\n      { name: 'Texto', swatches: [\n        { token: '--text', value: 'primário', style: mk('text') },\n        { token: '--text-2', value: 'secundário', style: mk('text-2') },\n        { token: '--text-3', value: 'terciário', style: mk('text-3') }\n      ]},\n      { name: 'Primária · violeta', swatches: [\n        { token: '--primary', value: 'base', style: mk('primary') },\n        { token: '--primary-strong', value: 'hover', style: mk('primary-strong') },\n        { token: '--primary-soft', value: 'fundo', style: mk('primary-soft') }\n      ]},\n      { name: 'Semânticas', swatches: [\n        { token: '--success', value: 'positivo', style: mk('success') },\n        { token: '--danger', value: 'negativo', style: mk('danger') },\n        { token: '--warning', value: 'atenção', style: mk('warning') },\n        { token: '--info', value: 'informação', style: mk('info') }\n      ]}\n    ];\n\n    const typeScale = [\n      { meta: 'Display · 56 · serif', sample: 'Garanta a primeira vitória', style: { fontFamily: \"'Newsreader', serif\", fontSize: '40px', fontWeight: 600, letterSpacing: '-.02em' } },\n      { meta: 'H1 · 40 · serif', sample: 'Título de seção editorial', style: { fontFamily: \"'Newsreader', serif\", fontSize: '30px', fontWeight: 600 } },\n      { meta: 'H2 · 24 · sans', sample: 'Cabeçalho de card', style: { fontSize: '24px', fontWeight: 700, letterSpacing: '-.01em' } },\n      { meta: 'Body · 16 · sans', sample: 'Texto de corpo padrão para leitura confortável.', style: { fontSize: '16px', fontWeight: 400, color: 'var(--text-2, #a1a1aa)' } },\n      { meta: 'Small · 13 · sans', sample: 'Texto de apoio e legendas', style: { fontSize: '13px', color: 'var(--text-2, #a1a1aa)' } },\n      { meta: 'Label · 11 · caps', sample: 'RÓTULO EM CAIXA-ALTA', style: { fontSize: '11px', fontWeight: 700, letterSpacing: '.08em', color: 'var(--text-3, #71717a)' } },\n      { meta: 'Mono · 12', sample: 'd54f6605-72a2-4fd2', style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: '13px', color: 'var(--text-2, #a1a1aa)' } }\n    ];\n\n    const spacing = [\n      { name: '2xs', px: '4px', w: 4 }, { name: 'xs', px: '8px', w: 8 }, { name: 'sm', px: '12px', w: 12 },\n      { name: 'md', px: '16px', w: 16 }, { name: 'lg', px: '24px', w: 24 }, { name: 'xl', px: '32px', w: 32 },\n      { name: '2xl', px: '48px', w: 48 }, { name: '3xl', px: '64px', w: 64 }\n    ].map(x => ({ name: x.name, px: x.px, style: { width: (x.w * 3) + 'px' } }));\n\n    const radii = [\n      { name: 'sm', px: '8px', r: 8 }, { name: 'md', px: '10px', r: 10 }, { name: 'lg', px: '14px', r: 14 },\n      { name: 'xl', px: '20px', r: 20 }, { name: 'pill', px: '999px', r: 40 }\n    ].map(x => ({ name: x.name, px: x.px, style: { borderRadius: x.r + 'px' } }));\n\n    const icons = ['home','info','bar-chart-2','users','trophy','book-open','credit-card','palette','bot','plug',\n      'smartphone','bell','message-circle','search','calendar','filter','zap','plus','download','upload',\n      'chevron-down','chevron-right','heart','share-2','check','x','flame','wifi','log-in','eye',\n      'sparkles','play','layers','clock','mail','file-text','settings','trash-2','pencil','more-horizontal'];\n\n    const leaders = [\n      { rank: 1, initials: 'RM', name: 'Rodrigo Melo', pts: '31 pts' },\n      { rank: 2, initials: 'KA', name: 'Kamile A.', pts: '25 pts' },\n      { rank: 3, initials: 'LR', name: 'Lutty Ramos', pts: '20 pts' }\n    ];\n\n    const users = [\n      { initials: 'AS', name: 'Ambar Soldevila', email: 'ambar@gmail.com', seal: false, date: '16/07/2026' },\n      { initials: 'MT', name: 'Mulher Ta On', email: 'contato@mulhertaon.com', seal: true, date: '15/07/2026' },\n      { initials: 'HR', name: 'Hernane Rodrigues', email: 'rodrigues@hotmail.com', seal: true, date: '15/07/2026' },\n      { initials: 'LB', name: 'Lucas Bernardes', email: 'lucasgabriel@gmail.com', seal: false, date: '14/07/2026' },\n      { initials: 'JF', name: 'Jessica Fazzio', email: 'cafecommaes@gmail.com', seal: true, date: '14/07/2026' }\n    ];\n\n    const bars = [\n      { label: '09', h: 30 }, { label: '10', h: 55 }, { label: '11', h: 45 },\n      { label: '12', h: 80 }, { label: '13', h: 65 }, { label: '14', h: 100 }\n    ].map(b => ({ label: b.label, style: { height: b.h + '%' } }));\n\n    return {\n      rootStyle: this.rootStyle(),\n      sectionTitle: titles[s] || '',\n      themeLabel: this.state.theme === 'light' ? 'Claro' : 'Escuro',\n      themeIcon: this.state.theme === 'light' ? 'sun' : 'moon',\n      toggleTheme: () => this.setState(st => ({ theme: st.theme === 'light' ? 'dark' : 'light' })),\n\n      navFoundations: [\n        this.navItem('overview', 'Visão geral', 'layout-dashboard'),\n        this.navItem('colors', 'Cores', 'palette'),\n        this.navItem('type', 'Tipografia', 'type'),\n        this.navItem('spacing', 'Espaçamento', 'ruler'),\n        this.navItem('elevation', 'Elevação', 'layers'),\n        this.navItem('icons', 'Iconografia', 'shapes')\n      ],\n      navComponents: [\n        this.navItem('buttons', 'Botões', 'mouse-pointer-click'),\n        this.navItem('forms', 'Inputs & Forms', 'text-cursor-input'),\n        this.navItem('badges', 'Badges & Status', 'badge-check'),\n        this.navItem('cards', 'Cards & Painéis', 'square-stack'),\n        this.navItem('metrics', 'Métricas', 'gauge'),\n        this.navItem('nav', 'Navegação', 'menu'),\n        this.navItem('tables', 'Tabelas', 'table'),\n        this.navItem('overlays', 'Overlays', 'copy'),\n        this.navItem('feedback', 'Feedback', 'bell-ring'),\n        this.navItem('dataviz', 'Data viz', 'line-chart')\n      ],\n\n      secOverview: s === 'overview', secColors: s === 'colors', secType: s === 'type',\n      secSpacing: s === 'spacing', secElevation: s === 'elevation', secIcons: s === 'icons',\n      secButtons: s === 'buttons', secForms: s === 'forms', secBadges: s === 'badges',\n      secCards: s === 'cards', secMetrics: s === 'metrics', secNav: s === 'nav',\n      secTables: s === 'tables', secOverlays: s === 'overlays', secFeedback: s === 'feedback',\n      secDataviz: s === 'dataviz',\n\n      colorGroups, typeScale, spacing, radii, icons, leaders, users, bars,\n\n      segInativaStyle: this.segStyle('inativa'),\n      segAtivaStyle: this.segStyle('ativa'),\n      setSegInativa: () => this.setState({ seg: 'inativa' }),\n      setSegAtiva: () => this.setState({ seg: 'ativa' }),\n\n      tabVisaoStyle: this.tabStyle('visao'),\n      tabCursosStyle: this.tabStyle('cursos'),\n      tabUsuariosStyle: this.tabStyle('usuarios'),\n      setTabVisao: () => this.setState({ tab: 'visao' }),\n      setTabCursos: () => this.setState({ tab: 'cursos' }),\n      setTabUsuarios: () => this.setState({ tab: 'usuarios' }),\n      tabLabel: { visao: 'Visão Geral', cursos: 'Cursos', usuarios: 'Usuários' }[this.state.tab],\n\n      miniNav: [\n        this.miniNavItem('Página inicial', 'home', true),\n        this.miniNavItem('Flashcards', 'gallery-vertical-end', false),\n        this.miniNavItem('Painel administrativo', 'layout-grid', false),\n        this.miniNavItem('Comunicados', 'message-square', false),\n        this.miniNavItem('Posts Salvos', 'bookmark', false)\n      ],\n\n      modal: this.state.modal,\n      toast: this.state.toast,\n      openModal: () => this.setState({ modal: true }),\n      closeModal: () => this.setState({ modal: false }),\n      stop: (e) => { e.stopPropagation(); },\n      showToastFn: () => {\n        this.setState({ toast: true });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ toast: false }), 2800);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
